<!DOCTYPE html>
<html lang="ua" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кабінет майстра | Явір Ілляна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root[data-theme="dark"] {
            --accent: #d88c9a; --accent-invert: #141312; --tg-bg: #141312;
            --tg-card: rgba(26, 24, 22, 0.85); --tg-card-hover: rgba(38, 35, 32, 0.92);
            --tg-border: rgba(255, 255, 255, 0.1); --tg-text: #f5f2ed; --tg-muted: #9e958b;
        }
        body { background-color: var(--tg-bg) !important; color: var(--tg-text) !important; padding-bottom: 50px; min-height: 100vh; margin: 0; }
        
        .master-section, .form-card { 
            background: var(--tg-card) !important; 
            border: 1px solid var(--tg-border) !important; 
            border-radius: 20px !important; 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        .master-utility-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; margin-bottom: 12px; }
        .korea-nav-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
        .korea-nav-chip { background: var(--tg-card); border: 1px solid var(--tg-border); padding: 10px 14px; border-radius: 14px; font-size: 9px; font-weight: 700; color: var(--tg-muted); text-transform: uppercase; cursor: pointer; white-space: nowrap; }
        .korea-nav-chip.active { background: var(--accent); color: var(--accent-invert); border-color: var(--accent); }
        
        .crm-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; box-sizing: border-box; }
        .crm-cal-cell { background: var(--tg-card-hover); border: 1px solid var(--tg-border); border-radius: 8px; padding: 8px 2px; text-align: center; font-size: 9px; font-weight: 700; cursor: pointer; }
        .crm-cal-cell.selected { background: var(--accent); color: var(--accent-invert); }
        .crm-cal-cell.blocked { background: rgba(216, 140, 154, 0.15); text-decoration: line-through; }
        .booking-card-item { background: var(--tg-card-hover); border: 1px solid var(--tg-border); border-radius: 12px; padding: 10px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 6px; }
    </style>
</head>
<body>

    <!-- Екран авторизації (Пароль 1414) -->
    <div id="authOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--tg-bg); z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: var(--tg-card); border: 1px solid var(--accent); padding: 24px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; box-shadow: 0 12px 40px rgba(0,0,0,0.3);">
            <h3 style="font-family: 'Syne', sans-serif; font-size: 16px; margin-bottom: 12px; color: var(--tg-text);">Вхід для майстра</h3>
            <input type="password" id="masterPass" class="input-box" placeholder="Введіть пароль" style="text-align: center; font-size: 14px; letter-spacing: 2px; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; margin-bottom: 16px;">
            <button class="btn-main" onclick="checkMasterPass()" style="width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-invert); font-weight: bold; border: none; cursor: pointer;">Увійти</button>
        </div>
    </div>

    <script>
        function checkMasterPass() {
            if (document.getElementById('masterPass').value === '1414') {
                document.getElementById('authOverlay').style.display = 'none';
            } else {
                alert('❌ Невірний пароль!');
                document.getElementById('masterPass').value = '';
            }
        }
    </script>

    <div class="mobile-container master-body" style="z-index: 10; position: relative; padding: 14px;">
        <div class="master-utility-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-family:'Syne',sans-serif; font-size:12px; font-weight:800; color:var(--tg-text);">ЯВІР ІЛЛЯНА // CRM</span>
            </div>
        </div>

        <div id="masterDashboard" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <div class="korea-nav-bar" id="koreaNavContainer">
                <div class="korea-nav-chip active" onclick="switchMasterSection('secCalendar', this)">📅 Календар</div>
                <div class="korea-nav-chip" onclick="switchMasterSection('secFinances', this)">💰 Фінанси</div>
                <div class="korea-nav-chip" onclick="switchMasterSection('secClients', this)">👥 Клієнти</div>
                <div class="korea-nav-chip" onclick="switchMasterSection('secWorks', this)">✨ Роботи</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;">
                <div class="form-card master-section" style="padding: 12px; text-align: center;">
                    <div style="font-size: 8px; color: var(--tg-muted);">УСЬОГО ЗАПИСІВ</div>
                    <div id="totalBookingsCountBadge" style="font-size: 15px; font-weight: 700; color: var(--accent);">0</div>
                </div>
                <div class="form-card master-section" style="padding: 12px; text-align: center;">
                    <div style="font-size: 8px; color: var(--tg-muted);">БАЗА КЛІЄНТІВ</div>
                    <div id="totalClientsCountBadge" style="font-size: 15px; font-weight: 700; color: var(--accent);">0</div>
                </div>
            </div>

            <div id="secCalendar" class="master-section form-card" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; width: 100%;">
                    <button class="control-btn" style="background: var(--tg-card-hover); color: white; border: none; padding: 6px 12px; border-radius: 8px;" onclick="changeMonth(-1)">◀</button>
                    <h3 id="calendarTitle" style="font-size: 12px; font-family:'Syne',sans-serif;">Місяць</h3>
                    <button class="control-btn" style="background: var(--tg-card-hover); color: white; border: none; padding: 6px 12px; border-radius: 8px;" onclick="changeMonth(1)">▶</button>
                </div>
                <div id="calendarGridContainer" class="crm-calendar-grid"></div>
                <button class="control-btn" id="blockDayBtn" onclick="toggleBlockSelectedDate()" style="width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; font-weight: 700; color: var(--accent); background: var(--tg-card-hover); border: 1px solid var(--tg-border);">🔒 Заблокувати день (вихідний)</button>
                <div style="margin-top: 10px; width: 100%;">
                    <label class="field-label" id="selectedDateLabel" style="color:var(--tg-muted); font-size: 9px; display: block; margin-bottom: 6px;">Записи на обраний день:</label>
                    <div id="dayBookingsContainer" style="display: flex; flex-direction: column; width: 100%;"></div>
                </div>
            </div>

            <div id="secFinances" class="master-section form-card" style="display: none; padding: 16px;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase; margin-bottom: 12px;">Фінанси та аналітика</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center;">
                    <div style="background:var(--tg-card-hover); padding:8px; border-radius:10px;">
                        <div style="font-size:8px; color:var(--tg-muted);">ДОХОДИ</div>
                        <div id="statCompleted" style="font-size:11px; font-weight:700;">0 ₴</div>
                    </div>
                    <div style="background:var(--tg-card-hover); padding:8px; border-radius:10px;">
                        <div style="font-size:8px; color:var(--tg-muted);">ВИТРАТИ</div>
                        <div id="statExpenses" style="font-size:11px; font-weight:700; color:var(--accent);">0 ₴</div>
                    </div>
                    <div style="background:var(--tg-card-hover); padding:8px; border-radius:10px;">
                        <div style="font-size:8px; color:var(--tg-muted);">ПРИБУТОК</div>
                        <div id="statNetProfit" style="font-size:11px; font-weight:700; color:#4ade80;">0 ₴</div>
                    </div>
                </div>

                <div style="margin-top: 12px;">
                    <label class="field-label" style="color:var(--tg-muted); font-size: 9px; display: block; margin-bottom: 6px;">Додати витрату (розхідники):</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="expenseNameInput" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;" placeholder="Назва">
                        <input type="number" id="expenseAmountInput" style="width: 80px; padding: 10px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;" placeholder="Сума ₴">
                        <button style="padding: 10px 14px; border-radius: 8px; background: var(--accent); color: var(--accent-invert); border: none; font-weight: bold; cursor: pointer;" onclick="addExpense()">+</button>
                    </div>
                    <div id="expensesListContainer" style="display: flex; flex-direction: column; gap: 4px; margin-top: 10px; max-height: 120px; overflow-y: auto;"></div>
                </div>
                <button style="margin-top: 12px; width: 100%; padding: 12px; border-radius: 12px; background: #217346; color: white; border: none; font-weight: bold; cursor: pointer;" onclick="exportToExcel()">📥 Експортувати в Excel</button>
            </div>

            <div id="secClients" class="master-section form-card" style="display: none; padding: 16px;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase; margin-bottom: 12px;">База клієнтів</h3>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" id="regClientName" style="padding: 10px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;" placeholder="Ім'я клієнта">
                    <input type="tel" id="regClientPhone" style="padding: 10px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;" placeholder="Телефон">
                    <input type="text" id="regClientSocial" style="padding: 10px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;" placeholder="Нікнейм (Inst / Telegram)">
                    <button style="width: 100%; padding: 12px; border-radius: 12px; background: var(--accent); color: var(--accent-invert); border: none; font-weight: bold; cursor: pointer;" onclick="addRegularClientManual()">Додати клієнта</button>
                </div>
                <div id="regularClientsContainer" style="display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; margin-top: 12px;"></div>
            </div>

            <div id="secWorks" class="master-section form-card" style="display: none; padding: 16px;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase; margin-bottom: 12px;">Завантажити роботи</h3>
                <div style="margin-bottom: 8px;">
                    <label class="field-label" style="font-size: 9px; color: var(--tg-muted); margin-bottom: 6px; display: block;">Назва / опис роботи:</label>
                    <input type="text" id="newWorkTitleInput" style="width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;" placeholder="Стрижка / Тонування">
                </div>
                <div style="margin-bottom: 12px;">
                    <label class="field-label" style="font-size: 9px; color: var(--tg-muted); margin-bottom: 6px; display: block;">Фотографія роботи:</label>
                    <input type="file" id="newWorkImageFile" accept="image/*" style="width: 100%; box-sizing: border-box; padding: 6px; border-radius: 8px; border: 1px solid var(--tg-border); background: var(--tg-card-hover); color: white; font-size: 10px;">
                </div>
                <button id="uploadWorkBtn" style="width: 100%; padding: 12px; border-radius: 12px; background: var(--accent); color: var(--accent-invert); border: none; font-weight: bold; cursor: pointer; transition: 0.2s;" onclick="uploadWorkToMainSite()">Завантажити на сайт</button>
                <div id="masterWorksList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <div id="masterDetailPopupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999999; justify-content:center; align-items:center; padding:16px; box-sizing: border-box;">
        <div style="background: var(--tg-card); border: 1.5px solid var(--accent); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
            <h3 style="font-family:'Syne',sans-serif; font-size:14px; color:var(--accent); text-transform:uppercase; text-align:center; margin: 0;">✨ Деталі запису</h3>
            <div id="modalBookingDetails" style="font-size:11px; line-height:1.6; display: flex; flex-direction: column; gap: 6px;"></div>
            <button style="width: 100%; padding: 12px; border-radius: 12px; background: var(--tg-card-hover); border: 1px solid var(--tg-border); color: white; font-weight: bold; cursor: pointer; margin-top: 10px;" onclick="closeBookingModal()">Закрити</button>
        </div>
    </div>

    <script>
        let currentMasterDate = new Date();
        let selectedCrmDate = new Date().toISOString().split('T')[0];
        let allBookingsCache = [];
        let blockedDaysCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            refreshCrmData();
            loadMasterWorks();
            updateFinancesAndExpenses();
            renderRegularClientsList();
        });

        async function refreshCrmData() {
            try {
                let resB = await fetch('/api/bookings');
                allBookingsCache = await resB.json() || [];

                let resD = await fetch('/api/blocked-days');
                blockedDaysCache = await resD.json() || [];

                document.getElementById('totalBookingsCountBadge').innerText = allBookingsCache.length;
                renderCrmCalendar();
                renderSelectedDayBookings();
                updateFinancesAndExpenses();
            } catch(e) {}
        }

        function switchMasterSection(sectionId, el) {
            document.querySelectorAll('.master-section').forEach(s => {
                if(s.id !== 'masterDetailPopupModal') s.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'flex';
            document.querySelectorAll('.korea-nav-chip').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function changeMonth(dir) {
            currentMasterDate.setMonth(currentMasterDate.getMonth() + dir);
            renderCrmCalendar();
        }

        function renderCrmCalendar() {
            let container = document.getElementById('calendarGridContainer');
            if (!container) return;
            container.innerHTML = '';

            let year = currentMasterDate.getFullYear();
            let month = currentMasterDate.getMonth();
            const monthsUa = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
            document.getElementById('calendarTitle').innerText = `${monthsUa[month]} ${year}`;

            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
            let totalDays = new Date(year, month + 1, 0).getDate();

            const daysNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
            daysNames.forEach(d => {
                let lbl = document.createElement('div');
                lbl.style.cssText = "font-size:8px; color:var(--tg-muted); text-align:center; font-weight:700; padding-bottom:4px;";
                lbl.innerText = d;
                container.appendChild(lbl);
            });

            for (let i = 0; i < firstDayIndex; i++) container.appendChild(document.createElement('div'));

            for (let day = 1; day <= totalDays; day++) {
                let dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let cell = document.createElement('div');
                cell.className = 'crm-cal-cell';
                if (dStr === selectedCrmDate) cell.classList.add('selected');
                if (blockedDaysCache.includes(dStr)) cell.classList.add('blocked');

                let hasBookings = allBookingsCache.some(b => b.date === dStr);
                cell.innerHTML = `<div>${day}</div>` + (hasBookings ? `<div style="font-size:6px; color:var(--accent);">● запис</div>` : '');

                cell.onclick = () => {
                    selectedCrmDate = dStr;
                    renderCrmCalendar();
                    renderSelectedDayBookings();
                };
                container.appendChild(cell);
            }
            updateBlockButtonState();
        }

        function renderSelectedDayBookings() {
            let container = document.getElementById('dayBookingsContainer');
            document.getElementById('selectedDateLabel').innerText = `Записи на ${selectedCrmDate}:`;

            let dayBooks = allBookingsCache.filter(b => b.date === selectedCrmDate);
            if (dayBooks.length === 0) {
                container.innerHTML = `<div style="font-size:9px; color:var(--tg-muted); text-align:center; padding:8px;">Немає записів</div>`;
                return;
            }

            container.innerHTML = '';
            dayBooks.forEach(b => {
                let item = document.createElement('div');
                item.className = 'booking-card-item';
                item.innerHTML = `
                    <div><b>🕐 ${b.time}</b> — ${b.name} (${b.phone})<br>
                    <span style="font-size:8px; color:var(--tg-muted);">${b.service} • ${b.price} ₴</span></div>
                    <span style="color:var(--accent);">➔</span>
                `;
                item.onclick = () => openBookingCardDetails(b);
                container.appendChild(item);
            });
        }

        function openBookingCardDetails(booking) {
            let refHtml = '—';
            if (booking.reference && booking.reference !== 'EMPTY') {
                if (booking.reference.startsWith('http') || booking.reference.startsWith('data:')) {
                    refHtml = `<br><img src="${booking.reference}" style="width:100%; border-radius:10px; margin-top:6px;">`;
                } else {
                    refHtml = `<br><b>${booking.reference}</b>`;
                }
            }

            document.getElementById('modalBookingDetails').innerHTML = `
                <div><b>Ім'я:</b> ${booking.name}</div>
                <div><b>Телефон:</b> <a href="tel:${booking.phone}" style="color:var(--accent); text-decoration: none;">${booking.phone}</a></div>
                <div><b>Дата та час:</b> ${booking.date} о ${booking.time}</div>
                <div><b>Послуга:</b> ${booking.service}</div>
                <div><b>Вартість:</b> ${booking.price} ₴</div>
                <div><b>Email:</b> ${booking.email}</div>
                <div><b>Референс / фото:</b>${refHtml}</div>
                <hr style="border-top:1px solid var(--tg-border); margin: 12px 0;">
                <button onclick="cancelClientBooking(${booking.id})" style="width: 100%; background: #e63946; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;">🗑 Видалити запис</button>
            `;
            document.getElementById('masterDetailPopupModal').style.display = 'flex';
        }

        async function cancelClientBooking(id) {
            if (!confirm("Ви впевнені, що хочете видалити цей запис?")) return;
            try {
                let res = await fetch('/api/cancel-booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                let data = await res.json();
                if (data.success) {
                    alert("✅ Запис успішно видалено!");
                    closeBookingModal(); refreshCrmData();
                } else { alert("Помилка відміни!"); }
            } catch (e) { alert("Помилка сервера."); }
        }

        async function toggleBlockSelectedDate() {
            let isBlocked = blockedDaysCache.includes(selectedCrmDate);
            let endpoint = isBlocked ? '/api/unblock-day' : '/api/block-day';
            let res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date: selectedCrmDate, password: '1414' }) });
            let data = await res.json();
            if (data.success) { blockedDaysCache = data.blockedDays; renderCrmCalendar(); }
        }

        function updateBlockButtonState() {
            let btn = document.getElementById('blockDayBtn');
            if (blockedDaysCache.includes(selectedCrmDate)) { btn.innerText = "🔓 Розблокувати день"; btn.style.borderColor = "var(--accent)"; } 
            else { btn.innerText = "🔒 Заблокувати день (вихідний)"; btn.style.borderColor = "var(--tg-border)"; }
        }

        function updateFinancesAndExpenses() {
            let totalIncome = allBookingsCache.reduce((sum, b) => sum + Number(b.price || 1000), 0);
            let expenses = JSON.parse(localStorage.getItem('illiana_studio_expenses') || '[]');
            let totalExpenses = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
            let net = totalIncome - totalExpenses;

            document.getElementById('statCompleted').innerText = totalIncome + " ₴";
            document.getElementById('statExpenses').innerText = totalExpenses + " ₴";
            document.getElementById('statNetProfit').innerText = net + " ₴";

            document.getElementById('expensesListContainer').innerHTML = expenses.map((e, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--tg-card-hover); padding:8px 12px; border-radius:8px; font-size:10px; border: 1px solid var(--tg-border);">
                    <span>${e.name} — <b style="color: var(--accent);">${e.amount} ₴</b></span>
                    <button onclick="removeExpense(${idx})" style="background:none; border:none; color:var(--tg-muted); font-size: 14px; cursor:pointer;">✕</button>
                </div>
            `).join('');
        }

        function addExpense() {
            let name = document.getElementById('expenseNameInput').value.trim();
            let amount = document.getElementById('expenseAmountInput').value.trim();
            if (!name || !amount) return alert("Введіть назву та суму!");
            let expenses = JSON.parse(localStorage.getItem('illiana_studio_expenses') || '[]');
            expenses.push({ name, amount });
            localStorage.setItem('illiana_studio_expenses', JSON.stringify(expenses));
            document.getElementById('expenseNameInput').value = '';
            document.getElementById('expenseAmountInput').value = '';
            updateFinancesAndExpenses();
        }

        function removeExpense(idx) {
            let expenses = JSON.parse(localStorage.getItem('illiana_studio_expenses') || '[]');
            expenses.splice(idx, 1);
            localStorage.setItem('illiana_studio_expenses', JSON.stringify(expenses));
            updateFinancesAndExpenses();
        }

        function exportToExcel() {
            if (allBookingsCache.length === 0) return alert("Немає записів!");
            let ws = XLSX.utils.json_to_sheet(allBookingsCache);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Записи");
            XLSX.writeFile(wb, "Illiana_Studio_Bookings.xlsx");
        }

        function renderRegularClientsList() {
            let clients = JSON.parse(localStorage.getItem('illiana_regular_clients') || '[]');
            document.getElementById('totalClientsCountBadge').innerText = clients.length;
            document.getElementById('regularClientsContainer').innerHTML = clients.map((c, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--tg-card-hover); padding:8px 12px; border-radius:8px; font-size:10px; border: 1px solid var(--tg-border);">
                    <div><b>${c.name}</b> (${c.phone})<br><span style="color:var(--accent); font-size: 9px;">${c.social || '—'}</span></div>
                    <button onclick="removeRegularClient(${idx})" style="background:none; border:none; color:var(--tg-muted); font-size: 14px; cursor:pointer;">✕</button>
                </div>
            `).join('');
        }

        function addRegularClientManual() {
            let name = document.getElementById('regClientName').value.trim();
            let phone = document.getElementById('regClientPhone').value.trim();
            let social = document.getElementById('regClientSocial').value.trim();
            if (!name || !phone) return alert("Введіть ім'я та телефон!");
            let clients = JSON.parse(localStorage.getItem('illiana_regular_clients') || '[]');
            clients.push({ name, phone, social });
            localStorage.setItem('illiana_regular_clients', JSON.stringify(clients));
            document.getElementById('regClientName').value = '';
            document.getElementById('regClientPhone').value = '';
            document.getElementById('regClientSocial').value = '';
            renderRegularClientsList();
        }

        function removeRegularClient(idx) {
            let clients = JSON.parse(localStorage.getItem('illiana_regular_clients') || '[]');
            clients.splice(idx, 1);
            localStorage.setItem('illiana_regular_clients', JSON.stringify(clients));
            renderRegularClientsList();
        }

        async function loadMasterWorks() {
            try {
                let res = await fetch('/api/works');
                let works = await res.json();
                let container = document.getElementById('masterWorksList');
                if (container) {
                    container.innerHTML = works.map(w => `
                        <div style="position:relative; height: 120px; border-radius: 12px; overflow: hidden; border: 1px solid var(--tg-border);">
                            <img src="${w.image}" style="width:100%; height:100%; object-fit:cover;">
                            <button onclick="deleteWork('${w.id}')" style="position:absolute; top:6px; right:6px; background:rgba(255,77,77,0.85); color:white; border:none; border-radius:6px; padding:4px 8px; font-size:10px; cursor:pointer;">🗑</button>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

       async function uploadWorkToMainSite() {
    let title = document.getElementById('newWorkTitleInput').value.trim();
    let fileInput = document.getElementById('newWorkImageFile');
    if (!fileInput.files[0]) return alert("Оберіть фотографію!");
    
    let btn = document.getElementById('uploadWorkBtn');
    let origText = btn.innerText;
    btn.innerText = "⏳ Обробка фото...";
    btn.style.pointerEvents = 'none';
    btn.style.opacity = '0.7';

    let reader = new FileReader();
    reader.readAsDataURL(fileInput.files[0]);
    
    reader.onerror = () => {
        alert("❌ Не вдалося прочитати файл");
        resetBtn();
    };

    reader.onload = (e) => {
        let img = new Image();
        img.src = e.target.result;

        img.onerror = () => {
            alert("❌ Непідтримуваний формат фото. Будь ласка, оберіть фото у JPG або PNG.");
            resetBtn();
        };

        img.onload = async () => {
            try {
                let canvas = document.createElement('canvas');
                
                // 1. Збільшуємо роздільну здатність до 1200px (ідеально для чіткості на смартфонах)
                let MAX_WIDTH = 1200; 
                let scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                let ctx = canvas.getContext('2d');
                
                // 2. Вмикаємо високоякісне згладжування, щоб дрібні деталі волосся не розмивалися
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // 3. Підвищуємо якість до 0.82 (82% замість 40%)
                let compressedImage = canvas.toDataURL('image/jpeg', 0.82); 

                btn.innerText = "⏳ Відправка на сайт...";

                let res = await fetch('/api/works', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ title, image: compressedImage })
                });
                
                let data = await res.json();
                
                if (data.success) {
                    alert("✅ Роботу успішно додано до портфоліо!");
                    document.getElementById('newWorkTitleInput').value = '';
                    fileInput.value = '';
                    loadMasterWorks();
                } else {
                    alert("❌ Помилка бази даних: " + (data.error || "Сервер відхилив запит."));
                }
            } catch (err) {
                alert("❌ Помилка зв'язку з сервером: " + err.message);
            } finally {
                resetBtn();
            }
        };
    };

    function resetBtn() {
        btn.innerText = origText;
        btn.style.pointerEvents = 'auto';
        btn.style.opacity = '1';
    }
}
