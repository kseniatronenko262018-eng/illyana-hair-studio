<!DOCTYPE html>
<html lang="ua" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Явір Ілляна // CRM Кабінет Майстра</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 12px; }
        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }
        .master-header h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); }
        .master-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }
        .m-chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 4px;
            border-radius: 12px;
            text-align: center;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-muted);
        }
        .m-chip.active {
            background: var(--accent);
            color: var(--accent-invert);
            border-color: var(--accent);
        }

        /* 🗓️ Стилі для календаря майстра */
        .master-calendar-wrapper {
            background: var(--card-hover);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .master-calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .master-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .m-day-header {
            font-size: 8px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-bottom: 4px;
        }
        .m-day-cell {
            height: 42px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .m-day-cell.selected {
            border-color: var(--accent);
            background: rgba(216, 140, 154, 0.2);
        }
        .m-day-cell.has-bookings::after {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
            box-shadow: 0 0 6px var(--accent);
        }

        .booking-card {
            background: var(--card-hover);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .booking-card:hover { border-color: var(--accent); }
        .booking-card .b-header { display: flex; justify-content: space-between; align-items: center; }
        .booking-card .b-name { font-size: 12px; font-weight: 700; color: var(--text-main); }
        .booking-card .b-time { font-size: 10px; font-weight: 800; color: var(--accent); background: rgba(216,140,154,0.15); padding: 2px 6px; border-radius: 6px; }
        .booking-card .b-sub { font-size: 10px; color: var(--text-muted); }
        
        .booking-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 99999;
            padding: 16px;
            justify-content: center;
            align-items: center;
        }
        .booking-modal-body {
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .btn-cancel-booking {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="mobile-container" style="max-width: 480px;">
        <div class="master-header">
            <h2>✨ ЯВІР ІЛЛЯНА // CRM</h2>
            <button class="control-btn" onclick="fetchMasterData()">🔄 Оновити</button>
        </div>

        <div class="master-nav">
            <div class="m-chip active" onclick="switchMasterTab('bookings', this)">📅 Календар записів</div>
            <div class="m-chip" onclick="switchMasterTab('blocked', this)">🔒 Вихідні</div>
            <div class="m-chip" onclick="switchMasterTab('portfolio', this)">✨ Роботи</div>
        </div>

        <!-- СЕКЦІЯ 1: КАЛЕНДАР ТА СПИСОК ЗАПИСІВ -->
        <div id="mPaneBookings" class="section-pane active">
            
            <!-- Інтерактивний календар майстра -->
            <div class="master-calendar-wrapper">
                <div class="master-calendar-header">
                    <button class="control-btn" onclick="changeMasterMonth(-1)">←</button>
                    <span id="masterMonthTitle">Жовтень 2026</span>
                    <button class="control-btn" onclick="changeMasterMonth(1)">→</button>
                </div>
                <div class="master-calendar-grid" id="masterCalendarDaysGrid"></div>
            </div>

            <div class="form-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label class="field-label" id="selectedDateLabel" style="margin:0;">Записи на обрану дату:</label>
                    <button class="control-btn" style="font-size:8px;" onclick="resetDateFilter()">Всі записи</button>
                </div>
                <div id="masterBookingsList" style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="font-size:10px; color:var(--text-muted); text-align:center;">Завантаження записів...</div>
                </div>
            </div>
        </div>

        <!-- СЕКЦІЯ 2: УПРАВЛІННЯ ВИХІДНИМИ ДНЯМИ -->
        <div id="mPaneBlocked" class="section-pane">
            <div class="form-card">
                <label class="field-label">Заблокувати / Розблокувати день</label>
                <input type="date" id="blockDateInput" class="input-box">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
                    <button class="btn-main" onclick="manageDayBlock('block')">🔒 Заблокувати</button>
                    <button class="btn-main" style="background:var(--card-hover); color:var(--text-main);" onclick="manageDayBlock('unblock')">🔓 Розблокувати</button>
                </div>
            </div>
            <div class="form-card">
                <label class="field-label">Заблоковані дати:</label>
                <div id="blockedDaysList" style="font-size: 10px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 6px;"></div>
            </div>
        </div>

        <!-- СЕКЦІЯ 3: УПРАВЛІННЯ ПОРТФОЛІО -->
        <div id="mPanePortfolio" class="section-pane">
            <div class="form-card">
                <label class="field-label">Додати нову роботу в галерею</label>
                <input type="file" id="newWorkPhotoInput" class="input-box" accept="image/*">
                <input type="text" id="newWorkTitleInput" class="input-box" placeholder="Назва / опис роботи (необов'язково)">
                <button class="btn-main" onclick="uploadNewWork()">📸 Опублікувати роботу</button>
            </div>
            <div class="form-card">
                <label class="field-label">Поточні роботи в портфоліо</label>
                <div id="masterWorksList" class="works-grid-full"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО ДЕТАЛЕЙ ЗАПИСУ -->
    <div id="bookingDetailModal" class="booking-modal">
        <div class="booking-modal-body">
            <h3 style="font-size: 12px; color: var(--text-main); text-align: center; text-transform: uppercase;">✨ ДЕТАЛІ ЗАПИСУ</h3>
            <div id="modalBookingDetailsContent" style="font-size: 10.5px; color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; gap: 6px;"></div>
            <button class="btn-cancel-booking" onclick="cancelCurrentBooking()">🗑 Відмінити запис</button>
            <button class="btn-main" style="background:var(--card-hover); color:var(--text-main);" onclick="closeBookingModal()">Закрити</button>
        </div>
    </div>

    <script>
        let allBookingsCache = [];
        let activeSelectedBooking = null;
        let masterCurrentDate = new Date();
        let selectedFilterDate = null;

        const monthNamesUa = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

        window.addEventListener('DOMContentLoaded', () => {
            fetchMasterData();
        });

        function switchMasterTab(tabName, element) {
            document.querySelectorAll('.section-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.m-chip').forEach(c => c.classList.remove('active'));

            if (tabName === 'bookings') document.getElementById('mPaneBookings').classList.add('active');
            if (tabName === 'blocked') document.getElementById('mPaneBlocked').classList.add('active');
            if (tabName === 'portfolio') {
                document.getElementById('mPanePortfolio').classList.add('active');
                loadMasterWorks();
            }
            if (element) element.classList.add('active');
        }

        async function fetchMasterData() {
            try {
                const res = await fetch('/api/bookings');
                allBookingsCache = await res.json();
                renderMasterCalendar();
                filterAndRenderBookings();

                const bRes = await fetch('/api/blocked-days');
                const blockedDays = await bRes.json();
                renderBlockedDays(blockedDays);
            } catch (e) {
                console.error("Помилка завантаження даних майстра:", e);
            }
        }

        function changeMasterMonth(delta) {
            masterCurrentDate.setMonth(masterCurrentDate.getMonth() + delta);
            renderMasterCalendar();
        }

        function renderMasterCalendar() {
            const grid = document.getElementById('masterCalendarDaysGrid');
            const monthTitle = document.getElementById('masterMonthTitle');
            if (!grid || !monthTitle) return;

            const year = masterCurrentDate.getFullYear();
            const month = masterCurrentDate.getMonth();
            monthTitle.innerText = `${monthNamesUa[month]}${year}`;

            grid.innerHTML = '';

            const dayHeaders = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
            dayHeaders.forEach(dh => {
                grid.innerHTML += `<div class="m-day-header">${dh}</div>`;
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            let startOffset = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

            for (let i = 0; i < startOffset; i++) {
                grid.innerHTML += `<div></div>`;
            }

            const bookedDatesSet = new Set(allBookingsCache.map(b => b.date));

            for (let day = 1; day <= daysInMonth; day++) {
                const formattedDay = String(day).padStart(2, '0');
                const formattedMonth = String(month + 1).padStart(2, '0');
                const isoDate = `${year}-${formattedMonth}-${formattedDay}`;

                const hasBookings = bookedDatesSet.has(isoDate);
                const isSelected = selectedFilterDate === isoDate;

                const dayCell = document.createElement('div');
                dayCell.className = `m-day-cell ${hasBookings ? 'has-bookings' : ''} ${isSelected ? 'selected' : ''}`;
                dayCell.innerText = day;
                dayCell.onclick = () => selectMasterCalendarDate(isoDate);

                grid.appendChild(dayCell);
            }
        }

        function selectMasterCalendarDate(isoDate) {
            if (selectedFilterDate === isoDate) {
                selectedFilterDate = null;
            } else {
                selectedFilterDate = isoDate;
            }
            renderMasterCalendar();
            filterAndRenderBookings();
        }

        function resetDateFilter() {
            selectedFilterDate = null;
            renderMasterCalendar();
            filterAndRenderBookings();
        }

        function filterAndRenderBookings() {
            const label = document.getElementById('selectedDateLabel');
            let filtered = allBookingsCache;

            if (selectedFilterDate) {
                filtered = allBookingsCache.filter(b => b.date === selectedFilterDate);
                if (label) label.innerText = `Записи на ${selectedFilterDate}:`;
            } else {
                if (label) label.innerText = `Всі актуальні записи:`;
            }

            renderBookingsList(filtered);
        }

        function renderBookingsList(bookings) {
            const container = document.getElementById('masterBookingsList');
            if (!container) return;

            if (!Array.isArray(bookings) || bookings.length === 0) {
                container.innerHTML = '<div style="font-size:10px; color:var(--text-muted); text-align:center; padding:12px;">Записів немає</div>';
                return;
            }

            container.innerHTML = bookings.map(b => `
                <div class="booking-card" onclick="openBookingModal('${b.id}')">
                    <div class="b-header">
                        <span class="b-name">${b.name}${b.isRegular ? '<span style="color:#4cd964; font-size:9px;">(Постійний)</span>' : ''}</span>
                        <span class="b-time">${b.date} о ${b.time}</span>
                    </div>
                    <div class="b-sub">✂️ ${b.service} • 💰 ${b.price || 1000} ₴</div>
                    <div class="b-sub">📞 ${b.phone}</div>
                </div>
            `).join('');
        }

        function openBookingModal(bookingId) {
            const b = allBookingsCache.find(item => String(item.id) === String(bookingId));
            if (!b) return;
            activeSelectedBooking = b;

            const modalContent = document.getElementById('modalBookingDetailsContent');
            modalContent.innerHTML = `
                <div><b>Ім'я:</b> ${b.name}</div>
